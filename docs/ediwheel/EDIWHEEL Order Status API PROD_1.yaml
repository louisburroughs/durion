      description: |
        Applicable Codes:
          * `A` - Ad hoc orders
          * `C` - Conventional orders (fax, letter, phone, e.g. by call center)
          * `E` - EDI orders
          * `I` - All electronic orders except conventional orders
          * `W` - Web portal orders
