openapi: 3.0.0
# The info section contains API information
info:
  # A machine and human readable detail of the API
  description: API provided to customers worldwide to track status of their orders
  # API implementation version
  version: 1.2.0
  # Title of API
  title: EDIWHEEL Order Status API
  # Contact details of API Producer
  contact:
    # Name of API Producer
    name: API Support
    email: devportal.support@michelin.com
    url: "https://developer.michelin.com/en/contact"
  license:
    name: Michelin
    url: https://developer.michelin.com/en/terms-and-conditions-use
# The servers section specifies the API server and base URL
servers:
  # Type of server(Dev/Indus/Sandbox/Production)
  - url: "https://api.michelin.com/order"
    description: Production
  - url: "https://sandbox.api.michelin.com/order"
    description: Sandbox

# A declaration of which security mechanisms can be used across the API. Each name must correspond to a security scheme which is declared in the Security Schemes under the Components Object.
security:
  - BasicAuth: []
tags:
  - name: EDIWheel A2.5
    description: Get the order status in A2.5 norm
  - name: EDIWheel C1.0
    description: Get the order status in C1.0 norm
  - name: EDIWheel C1.1
    description: Get the order status in C1.1 norm
paths:
  # Name of the resource to append to the basepath
  /A2_5/status:
    parameters:
        - $ref: '#/components/parameters/Apikey'
    post:
      tags:
        - Order Status EDIWheel A2.5
      description: Find your orders by date or by reference number.
      operationId: orderStatusA25POST
      summary: >-
        Find your orders by date or by reference number.
      requestBody:
        content:
          application/xml:
            schema:
              $ref: "#/components/schemas/orderStatusRequestA2"
      responses:
        # HTTP status code
        "200":
          description: OK
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/orderStatusA2"
        # HTTP status code
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyErrorResponse"
              example: 
                {
                    "fault": {
                        "faultstring": "Invalid ApiKey",
                        "detail": {
                            "errorcode": "oauth.v2.InvalidApiKey"
                        }
                    }
                }
        # HTTP status code
        "403":
          description: Forbidden
        # HTTP status code
        "404":
          description: Not Found
        # HTTP status code
        "500":
          # Description of status code
          description: Server error
          # Media type
          content:
            application/json:
              # Object definition
              schema:
                # Reference to object definition
                $ref: "#/components/schemas/ProxyErrorResponse"
              # Example value
              example:
                "fault":
                  {
                    "faultstring": "Internal server error occured",
                    "detail": { "errorcode": "500" },
                  }

        # HTTP status code
        "503":
          # Description of status code
          description: Service unavailable
          # Media type
          content:
            application/json:
              # Object definition
              schema:
                # Reference to object definition
                $ref: "#/components/schemas/ProxyErrorResponse"
              # Example value
              example: 
                {
                   "fault": {
                      "faultstring": "The Service is temporarily unavailable", 
                      "detail": {
                           "errorcode": "messaging.adaptors.http.flow.ServiceUnavailable"
                       }
                    }
                }

        # HTTP status code
        "504":
          # Description of status code
          description: Gateway timeout. A response was not available to send within the stipulated time limit.
          # Media type
          content:
            application/json:
              # Object definition
              schema:
                # Reference to object definition
                $ref: "#/components/schemas/ProxyErrorResponse"
              # Example value
              example: 
                {
                    "fault": {
                        "faultstring": "Gateway Timeout",
                        "detail": {
                            "errorcode": "messaging.adaptors.http.flow.GatewayTimeout"
                        }
                    }
                }
