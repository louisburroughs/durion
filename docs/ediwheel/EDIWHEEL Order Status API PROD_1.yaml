  url: https://ediwheel.net
components:
  parameters:
    Apikey:
      name: apikey
      in: header
      schema:
        type: string
      required: true
      description: API key is a code used to identify and authenticate an application or user.
  schemas:
    # Name of request/response object
    ProxyErrorResponse:
      # Data type of the schema (object)
      type: object
      properties:
        # Field Name
        fault:
          # Field Data type
          type: object
          properties:
            # Field Name
            faultstring:
              # Field Data type
              type: string
            # Field Name
            detail:
              # Field Data type
              type: object
              properties:
                # Field Name
                errorcode:
                  # Field Data type
                  type: string
    orderStatusRequestA2:
      type: object
      properties:
        documentID:
          type: string
          enum:
            - A2
          xml:
            name: DocumentID
        variant:
          type: string
          enum:
            - "5"
          xml:
            name: Variant
        orderDateFrom:
          $ref: "#/components/schemas/orderDateFrom"
        orderDateTo:
          $ref: "#/components/schemas/orderDateTo"
        orderingMethod:
          $ref: "#/components/schemas/orderingMethod"
        orderStatusIndicator:
          $ref: "#/components/schemas/orderStatusIndicator"
        buyerParty:
          $ref: "#/components/schemas/buyerParty"
        orderingParty:
          $ref: "#/components/schemas/orderingParty"
        consignee:
          $ref: "#/components/schemas/consignee"
        referencedOrder:
          type: array
          minItems: 0
          items:
            $ref: "#/components/schemas/referencedOrderRequestA2"
          xml:
            name: ReferencedOrder
      required:
        - documentID
        - buyerParty
        - variant
      xml:
        name: order_status_request_A2
        prefix: ew
        namespace: "http://www.reifen.net"
    orderStatusA2:
