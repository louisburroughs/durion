        orderDateFrom:
          $ref: "#/components/schemas/orderDateFrom"
        orderDateTo:
          $ref: "#/components/schemas/orderDateTo"
        orderStatusIndicator:
          $ref: "#/components/schemas/orderStatusIndicator"
        errorHead:
          type: object
          properties:
            errorCode:
              $ref: "#/components/schemas/errorCodeOrderStatusHeader"
          required:
            - errorCode
          xml:
            name: ErrorHead
        buyerParty:
          $ref: "#/components/schemas/buyerParty"
        orderingParty:
          $ref: "#/components/schemas/orderingParty"
        consignee:
