        # HTTP status code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorResponse'  
              example: 
                {
                    "fault": {
                        "faultstring": "Invalid ApiKey",
                        "detail": {
                            "errorcode": "oauth.v2.InvalidApiKey"
                        }
                    }
                }
        # HTTP status code  
        '403':
          description: Forbidden
        # HTTP status code  
        '404':
          description: Not Found
        # HTTP status code
        '500':
          # Description of status code
          description: Server error
          # Media type
          content:
            application/json:
              # Object definition
              schema:
                # Reference to object definition
                $ref: '#/components/schemas/ProxyErrorResponse'
              # Example value
              example:
                "fault":
                  {
                    "faultstring": "Internal server error occured",
                    "detail": { "errorcode": "500" },
                  }
        # HTTP status code
        '503':
          # Description of status code
          description: Service unavailable
          # Media type
          content:
            application/json:
              # Object definition
              schema:
                # Reference to object definition
                $ref: '#/components/schemas/ProxyErrorResponse'
              # Example value
              example: 
                {
                   "fault": {
                      "faultstring": "The Service is temporarily unavailable", 
                      "detail": {
                           "errorcode": "messaging.adaptors.http.flow.ServiceUnavailable"
                       }
                    }
                }
                
        # HTTP status code
        '504':
          # Description of status code
          description: Gateway timeout. A response was not available to send within the stipulated time limit.
          # Media type
          content:
            application/json:
              # Object definition
              schema:
                # Reference to object definition
                $ref: '#/components/schemas/ProxyErrorResponse'
              # Example value
              example: 
                {
                    "fault": {
                        "faultstring": "Gateway Timeout",
                        "detail": {
                            "errorcode": "messaging.adaptors.http.flow.GatewayTimeout"
                        }
                    }
                }
    
      tags:
