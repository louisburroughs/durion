openapi: 3.0.0
# The info section contains API information
info:
  # A machine and human readable details of the API
  description: API provided to customers worldwide to get information on all the products they are authorized to purchase
  # API implementation version 
  version: 1.2.0
  # Title of API
  title: EDIWheel Price Catalog
  # Contact details of API Producer
  contact: 
    # Name of API Producer
    name: API Support
    email: devportal.support@michelin.com
    url: 'https://developer.michelin.com/en/contact'
  license:
    name: Michelin
    url: https://developer.michelin.com/en/terms-and-conditions-use
# The servers section specifies the API server and base URL
servers:
     # Type of server(Dev/Indus/Sandbox/Production)
  - url: 'https://api.michelin.com'
    description: Production
  - url: 'https://sandbox.api.michelin.com'
    description: Sandbox
     
# A declaration of which security mechanisms can be used across the API. Each name must correspond to a security scheme which is declared in the Security Schemes under the Components Object.
security:
  - BasicAuth: []

tags:
  - name: Pricat EDIWheel B4.0
    description: Get the list of items you are authorized to purchase

