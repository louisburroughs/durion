externalDocs:
  description: Learn more about Ediwheel
  url: https://ediwheel.net
  
components:
  parameters:
    Apikey:
      name: apikey
      in: header
      schema:
        type: string
        default: AY9jLwxBUANYYZv05PV44Gn8AYPIZ9vR
      required: true
      description: API key is a code used to identify and authenticate an application or user.
    BuyerParty:
      name: buyerParty
      in: query
      description: Identifier of the customer for which the catalog is requested
      required: true
      schema:
        type: string
      example: 30012456
    AgencyCode:
      name: agencyCode
      in: query
      description: Code identifying the agency responsible for an identifier
      required: true
      schema:
        $ref: '#/components/schemas/agencyCode'
    EAN:
      name: ean
      in: query
      description: To filter the response on the EAN
      required: false
      schema:
        type: string
      example: 3528700607031
   # Defines a security scheme that can be used by the operations
  securitySchemes:
    # Name of the securitySchemes
    BasicAuth:
      scheme: basic
      type: http
  schemas:
    agencyCode:
      type: string
      enum:
        - '91'
        - '92'
        - '9'
      xml:
        name: AgencyCode
      description: |
        Applicable Codes:
          * `91` - Assigned by seller or seller's agent
          * `92` - Assigned by buyer or buyer's agent
          * `9`  - EAN (International Article Numbering Association)
    catalog:
      type: object
      properties:
        envelopeHeader:
          $ref: '#/components/schemas/envelopeHeader'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/article'
    envelopeHeader:
      type: object
      properties:
        documentId:
          type: string
        date:
          type: string
        receiverId:
          type: string
        # currency:
        #   type: string
        countryCode:
          type: string
        ediwheelVersion:
          type: string
          enum:
            - 'B4.0'
        errorCode:
          type: string
    article:
      type: object
      properties:
        pos:
          type: number
          format: int32
          minimum: 1
          description: Number to reference an item line.
        ean:
          type: string
          description: EAN code of product e.g.-EAN in EAN-market
        prodGrp1:
          type: string
          description: Manufacturer specific classification.
        supplierCode:
          type: string
          description: Supplier product code. Recommended to use EAN.
        description1:
          type: string
          description: Product Description
        description2: 
          type: string
          description: Second part of the product description
        # reserved: 
        #   type: string        
        msMark:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: M+S mark indicates winter capability of tires
        3pmsfMark:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Three Peak Mountain Snow Flake indicates winter capability of tires
        brand:
          type: string
          description: Brand key according to Supplier. Please contact your supplier for a code list.
        brandText:
          type: string
          description: Brand text according to Supplier
        prodGrp2:
          type: string
          description: Manufacturer product classification code 
        # groupDescription: 
        #   type: string            
        weight:
          type: string
          description: Unit net weight in kilogram, Integer or decimal value
        rimInch:
          type: string
          description: RIM diameter in inch. Integer or decimal value
        prodCycle:
          type: string
          enum:
            - 'W0'
            - 'W1'
            - 'W2'
            - 'W3'
          description: >
            Product Lifecycle:
             * `W0` - No information available
             * `W1` - In preparation
             * `W2` - Active
             * `W3` - Announcement of phase out
        thirdParty:
          type: string
          description: Third party supplied
        pl:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Part of printed pricelist
        tel:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Ability to order via Phone
        edi:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Ability to order via classic edi
        adhoc:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Ability to order via adhoc edi
        plId:
          type: string
          description: Price list group Id. This could be the identification code of the pricelist type used by the supplier
        url1:
          type: string
          description: URL for the website of the supplier related to the brand.
        url2:
          type: string
          description: URL for the address where pictures or other information’s could be available.
        url3:
          type: string
          description: Reserved
        url4:
          type: string
          description: Reserved. This url can be used to provide supplier own Tire Label reproduction facility. Valid only starting from EU directive 2020/740 or subsequent ones.
        url5:
          type: string
          description: Reserved. This url will be used to provide a link to the dataset of the appropriate item in EC Commission EPREL(European Product Registry for Energy Labelling) or similar databases of other countries. Valid only starting from EU directive 2020/740 or subsequent ones.
        widthMm:
          type: string
          description: Section width in mm (EU Standard)
        widthInch:
          type: string
          description: Section width in inch (US Standard)
        aspectRatio:
          type: string
          description: Aspect ratio (EU Standard)
        ovlDiameter:
          type: string
          description: Over all diameter in inch (US Standard)
        construction1:
          type: string
          description: Construction 1, e.g. R for radial or - for Bias
        construction2:
          type: string
          description: Reserved for future use
        usage:
          type: string
          description: Recommended tyre
        depth:
          type: string
          description: Tread depth in mm
        li1:
          type: string
          description: Load index single tyre 1
        li2:
          type: string
          description: Load index single tyre 2
        li3:
          type: string
          description: Load index twin tyre 1
        li4:
          type: string
          description: Load index twin tyre 2
        sp1:
          type: string
          description: Speed index 1
        sp2:
          type: string
          description: Speed index 2
        tltt:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: >
            Tube characteristic:
              * `Y` - Yes (Tubetype, TT)
              * `N` - No (Tubeless, TL)
        flank:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: If there is a flank protection
        pr:
          type: string
          description: Ply rate
        rfd:
          type: string
          description: Freetext. If it is filled then there is a Reinforced.
        sizePrefix:
          type: string
          enum:
            - 'P'
            - 'LT'
            - 'T'
          description: >
            Size prefix:
              * `P` - Passenger
              * `LT` - Light Truck
              * `T` - Truck
        commMark:
          type: string
          description: Commercial van mark
        rimMm:
          type: string
          description: Rim diameter in mm
        runFlat:
          type: string
          description: Free text. If it is filled then there is a Runflat.
        sidewall:
          type: string
          description: Free text. If it is filled then there is a Sidewall.
        design1:
          type: string
          description: Tread design
        design2:
          type: string
          description: Tread design sequel
        productType:
          type: string
          description: Product Type. Check codelist
        vehicleType:
          type: string
          enum:
            - 'CB'
            - 'C0'
            - 'L0'
            - 'L4'
            - 'LS'
            - 'T0'
            - 'TT'
            - 'TB'
            - 'E0'
            - 'I0'
            - 'F0'
            - 'M0'
            - 'MM'
            - 'MQ'
            - 'MK'
            - 'MS'
            - 'MP'
            - 'MB'
            - 'X0'
          description: Vechicle Type
        condGrp:
          type: string
          description: Supplier pricing group classification
        taxId:
          type: string
          description: Reduced Tax Rate
        tax:
          type: string
          description: The field must be indicated if the Tax Rate ID is filled.
        suggestedPrice:
          type: string
          description: Suggested Retail Price
        grossPrice:
          type: string
          description: Gross Price
        grossPriceValidFrom:
          type: string
          description: Gross Price Date valid from, FORMAT="YYYYMMDD"
        netValue:
          type: string
          description: Net Value
        netValueValidFrom:
          type: string
          description: Net value date valid from, FORMAT="YYYYMMDD"
        recyclingFee:
          type: string
          description: Recycling fee expressed in amount
        noisePerformance:
          type: string
          description: Expressed in dB(A)
        noiseClassType:
          type: string
          enum:
            - 'A'
            - 'B'
            - 'C'
          description: >
            Noise Class:
             * `A` - Low
             * `B` - Medium
             * `C` - High
        rollingResistance:
          type: string
          description: Expressed by a grade letter (from A to G)
        wetGrip:
          type: string
          description: Expressed by a grade letter (from A to G)
        ecVehicleClass:
          type: string
          enum:
            - 'C1'
            - 'C2'
            - 'C3'
          description: Expressed by Vehicle Class
        euDirectiveNumber:
          type: string
          description: EU directive number
        traCode:
          type: string
          enum:
            - 'C-1' 
            - 'C-2' 
            - 'E-1' 
            - 'E-2' 
            - 'E-3' 
            - 'E-4' 
            - 'E-7' 
            - 'G-1' 
            - 'G-2' 
            - 'G-3' 
            - 'L-2' 
            - 'L-3' 
            - 'L-4' 
            - 'L-5' 
            - 'L-3S' 
            - 'L-4S' 
            - 'L-5S'
          description: OTR-Tire classification according to ETRTO (or Tires and Rims Association)
        seal:
          type: string
          description: Self Repairing Filling in Tires
        specialCompound:
          type: string
          description: Indicates if special compound e.g to be applicable for extreme temperatures, e.g. ICE, HCT
        directional:
          type: string
          description: Indicates directional tread pattern of tire
        asymetric:
          type: string
          description: Indicates asymetric tread pattern of tire
        xReferenceCode:
          type: string
          description: UPC in EAN-world or EAN in UPC-world. Unique product identfication. Related to content of field 003 EAN/UPC code.
        marketCompliance:
          type: string
          description: Indicates compliance of tire to specific international legal market requirement.
        wheelPosition:
          type: string
          description: Wheel Position
        priceReferenceMaterial:
          type: string
          description: EAN of main-component of assembly (Tires)
        recommendedReplacementArticle:
          type: string
          description: In case of non availibility of the article, this field can be used to determine an alternative.
        nonGradingEligibility:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Y = not relevant for grading, N = relevant for grading
        rfid:
          type: string
          enum:
            - 'Y'
            - 'N'
          description: Indicates if RFID is applied in tire
        designVariant:
          type: string
          description: Unique code per tire manufacturer related to visual tread design.
    # Name of request/response object
    ProxyErrorResponse:
      # Data type of the schema (object)
      type: object
      properties:
        # Field Name
        fault: 
          # Field Data type
          type: object
          properties: 
            # Field Name
            faultstring: 
              # Field Data type
              type: string
            # Field Name
            detail: 
              # Field Data type
              type: object
              properties: 
                # Field Name
                errorcode: 
                  # Field Data type
                  type: string