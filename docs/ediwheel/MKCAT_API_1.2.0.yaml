  /treadDesignVariants/{ID}/images:
    description: Get images of one specific TreadDesignVariant.
    get:
      tags:
        - Marketing Catalogue
      description: |
        Get images of a single TreadDesignVariant.
        The response supports three different mediaTypes. Any image provides by the supplier is available through the API in each of those three formats.
      operationId: getTreadDesignVariantImages
      parameters:
        - name: minResolution
          in: query
          description: Minimum resolution in DPI
          schema:
            $ref: '#/components/schemas/resolution'
        - name: maxResolution
          in: query
          description: Maximum resolution in DPI
          schema:
            $ref: '#/components/schemas/resolution'
        - $ref: '#/components/parameters/fileType'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: |
                With this header the pagination links are provided to the consumer as defined in [RFC 5988](https://datatracker.ietf.org/doc/html/rfc5988).

                #### Examples

                __Link to current page (mandatory):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants/EUGRIP/images?cursor=XXX>; rel="current"

                __Link to first page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants/EUGRIP/images?cursor=FFF>; rel="first"

                __Link to next page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants/EUGRIP/images?cursor=NNN>; rel="next"

                __Link to previous page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants/EUGRIP/images?cursor=PPP>; rel="prev"

                __Link to last page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants/EUGRIP/images?cursor=LLL>; rel="last"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/image'
              example:
                - ImageType: 25DegreeFull
                  DefinitionHeight: '231'
                  DefinitionWidth: '360'
                  Resolution: '75'
                  FileType: png
                  FileName: example.png
                  URI: 'https://ediwheel.net/wp-content/uploads/example.png'
                - ImageType: FrontFull
                  DefinitionHeight: '150'
                  DefinitionWidth: '360'
                  Resolution: '75'
                  FileType: png
                  FileName: example2.png
                  URI: 'https://ediwheel.net/wp-content/uploads/example2.png'
                - ImageType: SideFull
                  DefinitionHeight: '240'
                  DefinitionWidth: '240'
                  Resolution: '75'
                  FileType: png
                  FileName: example3.png
                  URI: 'https://ediwheel.net/wp-content/uploads/example3.png'
        '400':
