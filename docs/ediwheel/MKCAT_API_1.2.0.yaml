tags:
  - name: Administration
    description: Generic administrative API functions.
  - name: Marketing Catalogue
    description: The marketing catalogue provides all necessary information for a representation of given TreadDesignVariants in the web. In includes images as well as languagage dependent information.
  - name: Suppliers
    description: The EDIWheel API supports handling of supplier parties as well. An example application is an information provider. The information provider offers the TreadDesignVariants to all tire manufacturers over a single platform solution. This way a party can be a manufacturer or a customer of the service provider as well.
  - name: Unsupported Operation
    description: The following services are explicitly not supported. Nevertheless they are defined to be compliant to the UN/CEFACT OpenAPI NDR guideline.