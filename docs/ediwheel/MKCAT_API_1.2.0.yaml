openapi: 3.0.3
info:
  title: EDIWheel API
  description: |
    Last modification: 2026-02-04 based on C1.2.
    ---
    As a start it supports the marketing catalogue. 
    It combines a resource based approach as well as a message based approach to support legacy systems.
  termsOfService: 'https://ediwheel.net/data-privacy/'
  contact:
    name: wdk Wirtschaftsverband der deutschen Kautschukindustrie e.V.
    url: 'https://ediwheel.net'
    email: 'info@wdk.de'
  license:
    name: THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
  version: 1.2.0
servers:
  - url: 'https://api.ediwheel.net/v1/'
paths:
  /:
    description: Get info about this API
    get:
      tags:
        - Administration
      description: Get info about this API.
      operationId: getAPIInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiInfoResponse'
        '400':
          $ref: '#/components/responses/400_invalid_parameter_id'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_forbidden'
        '408':
          $ref: '#/components/responses/408_no_message'
        '415':
          $ref: '#/components/responses/415_only_json'
        '429':
          $ref: '#/components/responses/429_too_many_requests'
        '500':
          $ref: '#/components/responses/500_internal_server_error'
        '503':
          $ref: '#/components/responses/503_come_back_later'
    post:
      tags:
        - Unsupported Operation
      responses:
        '405':
          $ref: '#/components/responses/405_Method_Not_Allowed_Only_GET'
    patch:
      tags:
        - Unsupported Operation
      responses:
        '405':
          $ref: '#/components/responses/405_Method_Not_Allowed_Only_GET'
    put:
      tags:
