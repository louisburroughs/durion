    cursor:
      name: cursor
      in: query
      description: The cursor is an identifier string defined by the server to identify a filtered and / or sorted list of results by a consumer at a specific moment in time. It devides a result list to everything before the cursor, everything after the cursor and, optionally, a specific record "on" the cursor.
