      required: false
      allowEmptyValue: false
      schema:
        $ref: '#/components/schemas/vehicleType'
      example: T0
    seasonality:
      name: seasonality
      in: query
      description: Select the applicable seasonality as filter criteria
      required: false
      allowEmptyValue: false
      schema:
        $ref: '#/components/schemas/seasonality'
      example: 03
    treadDesign1:
      name: treadDesign1
      in: query
      description: |
        The treadDesign1 represents the overall design, regardless of any optical differences / specifics.
        A single treadDesign1 can consist of multiple treadDesignVariants.
      schema:
        type: string
      example: Tyre Lorem Ipsum 1
