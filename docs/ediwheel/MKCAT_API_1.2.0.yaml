            Link:
              description: |
                With this header the pagination links are provided to the consumer as defined in [RFC 5988](https://datatracker.ietf.org/doc/html/rfc5988).

                #### Examples

                __Link to current page (mandatory):__

                    Link: <https://api.ediwheel.net/v1/suppliers?cursor=XXX>; rel="current"

                __Link to first page (optional):__

                    Link: <https://api.ediwheel.net/v1/suppliers?cursor=FFF>; rel="first"

                __Link to next page (optional):__

                    Link: <https://api.ediwheel.net/v1/suppliers?cursor=NNN>; rel="next"

                __Link to previous page (optional):__

                    Link: <https://api.ediwheel.net/v1/suppliers?cursor=PPP>; rel="prev"

                __Link to last page (optional):__

                    Link: <https://api.ediwheel.net/v1/suppliers?cursor=LLL>; rel="last"
