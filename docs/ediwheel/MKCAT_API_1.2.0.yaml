  /mktcat/:
    description: Marketing Catalogue message support
    get:
      tags:
        - Marketing Catalogue
      description: |
        Get current mktcat for legacy systems in a message structure.
        Will be deprecated sometime in future?
      operationId: getMktcat
      parameters:
        - $ref: '#/components/parameters/language'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/treadDesign1'
      responses:
        '200':
          description: OK
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/mktCat'
              example: |
                <mktCat>
                	<EnvelopeHeader>
                		<DocumentID>C1</DocumentID>
                		<Variant>1</Variant>
                		<MessageType>MktCat</MessageType>
                	</EnvelopeHeader>
                	<MktCatHeader>
                		<CatalogueType>FULL</CatalogueType>
                		<TextFormattingControlMethod>HTML</TextFormattingControlMethod>
                		<SupplierParty>
                			<PartyID>123456789</PartyID>
                			<AgencyCode>9</AgencyCode>
                			<Name>Tire Supplier</Name>
                			<InformationContact>
                				<ContactID>1234</ContactID>
                				<Name>John Smith</Name>
                				<TelephoneNumber>+49123456789</TelephoneNumber>
                				<TelephoneExtension>89</TelephoneExtension>
                				<FaxNumber>+49121</FaxNumber>
                				<EmailAddress>john.smith@ediwheel-example.net</EmailAddress>
                			</InformationContact>
                		</SupplierParty>
                		<BrandInfo>
                			<BrandInfoID>BrandID</BrandInfoID>
                			<Brand>TyreBrand</Brand>
