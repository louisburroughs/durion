  /treadDesignVariants/:
    description: List of marketing catalogue items
    get:
      tags:
        - Marketing Catalogue
      description: Get list of TreadDesignVariants
      operationId: getTreadDesignVariantList
      parameters:
        - $ref: '#/components/parameters/afterDate'
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/vehicleType'
        - $ref: '#/components/parameters/seasonality'
        - name: hasPromotions
          in: query
          description: Filter on promotion.
          schema:
            type: boolean
        - $ref: '#/components/parameters/treadDesign1'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: |
                With this header the pagination links are provided to the consumer as defined in [RFC 5988](https://datatracker.ietf.org/doc/html/rfc5988).

                #### Examples

                __Link to current page (mandatory):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants?cursor=XXX>; rel="current"

                __Link to first page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants?cursor=FFF>; rel="first"

                __Link to next page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants?cursor=NNN>; rel="next"

                __Link to previous page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants?cursor=PPP>; rel="prev"

                __Link to last page (optional):__

                    Link: <https://api.ediwheel.net/v1/treadDesignVariants?cursor=LLL>; rel="last"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/treadDesignVariantList'
              example:
                - TreadDesignVariant: TYRE1
                  TreadDesign1: Tyre Lorem Ipsum 1
                  TreadDesign2: TLORIMPS1
                  ProductName: Tyre Product Name
                  MainFunction: CA
                - TreadDesignVariant: TYRE2
                  TreadDesign1: Tyre Lorem Ipsum 2
                  TreadDesign2: TLORIMPS2
                  ProductName: Tyre Product Name 2
          links:
            partyByBrand:
              operationId: getAllSuppliers
              parameters:
                brand: '$response.body#/Brand'
            images:
              $ref: '#/components/links/TreadDesignVariant_images'
            languageDependentData:
              $ref: '#/components/links/TreadDesignVariant_languageDependentData'
        '400':
          $ref: '#/components/responses/400_invalid_parameter_id'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_forbidden'
        '408':
          $ref: '#/components/responses/408_no_message'
        '415':
          $ref: '#/components/responses/415_only_json'
        '429':
          $ref: '#/components/responses/429_too_many_requests'
        '500':
          $ref: '#/components/responses/500_internal_server_error'
        '503':
          $ref: '#/components/responses/503_come_back_later'
    post:
      tags:
        - Unsupported Operation
      responses:
        '405':
          $ref: '#/components/responses/405_Method_Not_Allowed_Only_GET'
    patch:
      tags:
        - Unsupported Operation
      responses:
        '405':
          $ref: '#/components/responses/405_Method_Not_Allowed_Only_GET'
    put:
      tags:
        - Unsupported Operation
      responses:
        '405':
          $ref: '#/components/responses/405_Method_Not_Allowed_Only_GET'
    delete:
      tags:
        - Unsupported Operation
      responses:
        '405':
          $ref: '#/components/responses/405_Method_Not_Allowed_Only_GET'
  /treadDesignVariants/subscribe/:
    description: Subscribe to an event. You will get informed once the defined filter is met.
    post:
      tags:
        - Marketing Catalogue
      description: Add a subscriber
      operationId: subscribeToTreadDesingVariantChanges
      parameters:
        - name: callbackUrl
          in: query
          description: The API consumers URL that is called if the event is fired.
          required: true
          schema:
            type: string
          example: 'https://client.shop.tld/notify'
        - name: event
          in: query
          description: The event to subscribe to
          required: true
          schema:
            $ref: '#/components/schemas/eventType'
          example: newTreadDesignVariant
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/afterDate'
        - $ref: '#/components/parameters/brand'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
              example: 'https://api.ediwheel.net/ediwheel/v1/treadDesignVariants/subscribe/AAA-123-BBB-456'
          links:
            unsubscribe:
              operationId: unsubscribeTreadDesignVariantsEvent
              parameters:
                Id: '$response.body#/'
              description: Unsubscribe for event
        '400':
          $ref: '#/components/responses/400_invalid_parameter_id'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_forbidden'
        '404':
          $ref: '#/components/responses/404_not_found'
        '408':
          $ref: '#/components/responses/408_no_message'
        '415':
          $ref: '#/components/responses/415_only_json'
        '429':
          $ref: '#/components/responses/429_too_many_requests'
        '500':
          $ref: '#/components/responses/500_internal_server_error'
        '503':
          $ref: '#/components/responses/503_come_back_later'
      callbacks:
        myEvent:
          "{$request.query.callbackUrl}?event={$request.query.event}":
            description: Callback for events on treadDesignVariants.
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      type: string
                    example: 'https://api.ediwheel.net/ediwheel/v1/treadDesignVariants/EAGF1AS2'
              responses:
                '200':
                  description: OK
                '400':
                  $ref: '#/components/responses/400_invalid_parameter_id'
                '401':
                  $ref: '#/components/responses/401_unauthorized_error'
                '403':
                  $ref: '#/components/responses/403_forbidden'
                '404':
                  $ref: '#/components/responses/404_not_found'
                '408':
                  $ref: '#/components/responses/408_no_message'
                '415':
                  $ref: '#/components/responses/415_only_json'
                '429':
                  $ref: '#/components/responses/429_too_many_requests'
                '500':
                  $ref: '#/components/responses/500_internal_server_error'
                '503':
                  $ref: '#/components/responses/503_come_back_later'
    delete:
      tags:
        - Marketing Catalogue
      description: Unsubscribe from event
      operationId: unsubscribeTreadDesignVariantsEvent
      parameters:
        - name: ID
          in: query
          description: The subscription ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully unsubscribed.
        '400':
          $ref: '#/components/responses/400_invalid_parameter_id'
        '401':
          $ref: '#/components/responses/401_unauthorized_error'
        '403':
          $ref: '#/components/responses/403_forbidden'
        '404':
          $ref: '#/components/responses/404_not_found'
        '408':
          $ref: '#/components/responses/408_no_message'
        '415':
          $ref: '#/components/responses/415_only_json'
        '429':
          $ref: '#/components/responses/429_too_many_requests'
        '500':
          $ref: '#/components/responses/500_internal_server_error'
        '503':
          $ref: '#/components/responses/503_come_back_later'
