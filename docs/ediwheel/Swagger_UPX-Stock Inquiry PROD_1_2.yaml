    availability:
      type: string
      enum:
        - '0'
        - '1'
        - '2'
        - '3'
      description: |
        Applicable Codes:
          * `0` - Error, no availability could be determined
          * `1` - The article is immediately available in the requested quantity
          * `2` - The article is not available in the requested quantity for the requested delivery date, so temporarily delays or partial deliveries could occur. Here the announced actual quantity should be considered
          * `3` - The article is currently not available
      xml:
        name: Availability
